<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="gk_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f0ff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="gk_grad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00f0ff;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:0.7"/>
    </linearGradient>
  </defs>
  <!-- Shield outline -->
  <path d="M100 12 L175 50 L175 120 Q175 160 100 190 Q25 160 25 120 L25 50 Z" 
        stroke="url(#gk_grad)" stroke-width="5" fill="none" stroke-linejoin="round"/>
  <!-- Inner shield accent -->
  <path d="M100 28 L162 60 L162 118 Q162 150 100 175 Q38 150 38 118 L38 60 Z" 
        stroke="url(#gk_grad2)" stroke-width="2" fill="rgba(0,240,255,0.04)" stroke-linejoin="round"/>
  <!-- Controller body -->
  <rect x="62" y="78" width="76" height="38" rx="19" ry="19" 
        stroke="url(#gk_grad)" stroke-width="4" fill="rgba(0,240,255,0.08)"/>
  <!-- D-pad vertical -->
  <rect x="77" y="85" width="8" height="24" rx="2" fill="url(#gk_grad)"/>
  <!-- D-pad horizontal -->
  <rect x="69" y="93" width="24" height="8" rx="2" fill="url(#gk_grad)"/>
  <!-- Button dots -->
  <circle cx="122" cy="89" r="4" fill="#00f0ff"/>
  <circle cx="134" cy="97" r="4" fill="#8b5cf6"/>
  <circle cx="122" cy="105" r="4" fill="#a855f7"/>
  <circle cx="110" cy="97" r="4" fill="#00d4ff"/>
  <!-- Cart wheels -->
  <circle cx="78" cy="140" r="7" stroke="url(#gk_grad)" stroke-width="3" fill="none"/>
  <circle cx="122" cy="140" r="7" stroke="url(#gk_grad)" stroke-width="3" fill="none"/>
  <!-- Cart handle -->
  <path d="M65 130 L60 120 L55 120" stroke="url(#gk_grad)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Cart body line -->
  <path d="M68 130 L132 130" stroke="url(#gk_grad)" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
